name: Windows installer build

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "backend_service.py"
      - "requirements.txt"
      - "native/**"
      - "assets/**"
      - "Install-ScarClipScheduler.ps1"
      - "README-INSTALL.txt"
      - "build_windows_exe.ps1"
      - "installer/**"
      - "tests/**"
      - ".github/workflows/build-exe.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build ScarClipScheduler setup EXE
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Inno Setup 6
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Install publishing-worker dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python regression suite
        shell: powershell
        run: |
          python -m py_compile app.py backend_service.py
          python -m unittest discover -s tests -v

      - name: Run native desktop API contract test
        shell: powershell
        run: dotnet run --project tests/native-api-contract/ScarClipScheduler.ApiContractTests.csproj --configuration Release

      - name: Build Windows installer
        shell: powershell
        run: .\build_windows_exe.ps1

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: ScarClipScheduler-Setup
          path: dist/installer/ScarClipScheduler-Setup.exe
          if-no-files-found: error
          retention-days: 30
