name: Windows native WPF package

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "backend_service.py"
      - "requirements.txt"
      - "native/**"
      - "assets/**"
      - "Install-ScarClipScheduler.ps1"
      - "README-INSTALL.txt"
      - "build_windows_exe.ps1"
      - "tests/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package ScarClipScheduler
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install publishing-worker dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python regression suite
        shell: powershell
        run: |
          python -m py_compile app.py backend_service.py
          python -m unittest discover -s tests -v

      - name: Build native Windows ZIP
        shell: powershell
        run: .\build_windows_exe.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ScarClipScheduler-Windows-x64
          path: dist/ScarClipScheduler-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
