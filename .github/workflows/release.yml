name: Publish Windows installer release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ScarClipScheduler setup EXE
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Inno Setup 6
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Install publishing-worker dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python regression suite
        shell: powershell
        run: |
          python -m py_compile app.py backend_service.py
          python -m unittest discover -s tests -v

      - name: Run native desktop API contract test
        shell: powershell
        run: dotnet run --project tests/native-api-contract/ScarClipScheduler.ApiContractTests.csproj --configuration Release

      - name: Build Windows installer
        shell: powershell
        run: .\build_windows_exe.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/installer/ScarClipScheduler-Setup.exe

      # Retain download files only on the release created by this tag.
      # Older release entries and their notes remain available.
      - name: Remove assets from older releases
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentTag = context.ref.replace(/^refs\/tags\//, "");

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );
            const publishedReleases = releases
              .filter(release => !release.draft && release.published_at)
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at));
            const latestRelease = publishedReleases[0];

            if (!latestRelease) {
              throw new Error("No published release was found after publishing the current tag.");
            }
            core.info(`Keeping the newest published release: ${latestRelease.tag_name} (workflow tag: ${currentTag})`);

            let deletedCount = 0;
            for (const release of releases) {
              if (release.id === latestRelease.id || release.draft) {
                continue;
              }

              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner, repo, release_id: release.id, per_page: 100 }
              );

              for (const asset of assets) {
                core.info(`Removing ${asset.name} from older release ${release.tag_name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id
                });
                deletedCount += 1;
              }
            }

            core.notice(`Removed ${deletedCount} uploaded asset(s) from older releases. Newest release ${latestRelease.tag_name} keeps its assets.`);
